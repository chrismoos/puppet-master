[package]
name = "pm-native-terminal"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A Puppet Master terminal drawn natively with libghostty"
publish = false

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
fontdb = "0.24.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
pm-ghostty = { path = "../../../crates/pm-ghostty" }
swash = "0.2.10"
tokio = { version = "1.54.1", features = ["rt", "sync", "macros", "net", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
wgpu = "30.0.2"

[dev-dependencies]
pollster = "1.0.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
