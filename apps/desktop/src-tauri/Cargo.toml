[package]
name = "pm-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Puppet Master desktop client"
publish = false

[lib]
name = "pm_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["dynamic-acl"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
pm-native-terminal = { path = "../terminal" }
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
